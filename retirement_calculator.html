<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>退休计算器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
  .card { background: white; border-radius: 16px; padding: 32px; width: 100%; max-width: 420px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); }
  h1 { font-size: 22px; text-align: center; margin-bottom: 24px; color: #1a1a1a; }
  .group { margin-bottom: 18px; }
  label { display: block; font-size: 14px; color: #666; margin-bottom: 6px; }
  input, select { width: 100%; padding: 12px 14px; border: 1.5px solid #e0e0e0; border-radius: 10px; font-size: 16px; transition: border-color 0.2s; outline: none; }
  input:focus, select:focus { border-color: #4a90e2; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  button { width: 100%; padding: 14px; background: #4a90e2; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 6px; }
  button:hover { background: #3a7bc8; }
  .result { margin-top: 24px; padding: 20px; background: #f8fafc; border-radius: 12px; display: none; }
  .result.show { display: block; }
  .result-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #e8e8e8; }
  .result-item:last-child { border-bottom: none; }
  .result-item .label { font-size: 14px; color: #666; }
  .result-item .value { font-size: 18px; font-weight: 700; color: #1a1a1a; }
  .result-item .value.highlight { color: #e67e22; font-size: 22px; }
  .disclaimer { font-size: 11px; color: #aaa; text-align: center; margin-top: 16px; line-height: 1.5; }
</style>
</head>
<body>
<div class="card">
  <h1>🧮 退休计算器</h1>

  <div class="group">
    <label>性别</label>
    <select id="gender">
      <option value="male">男</option>
      <option value="female">女</option>
    </select>
  </div>

  <div class="row">
    <div class="group">
      <label>出生年份</label>
      <input type="number" id="birthYear" placeholder="1990" min="1940" max="2010">
    </div>
    <div class="group">
      <label>当前年龄</label>
      <input type="number" id="currentAge" placeholder="30" min="18" max="80">
    </div>
  </div>

  <div class="row">
    <div class="group">
      <label>退休年龄</label>
      <input type="number" id="retireAge" placeholder="60" min="50" max="70">
    </div>
    <div class="group">
      <label>月薪（元）</label>
      <input type="number" id="monthlySalary" placeholder="10000" min="1000">
    </div>
  </div>

  <div class="group">
    <label>个人缴纳基数（元）</label>
    <input type="number" id="contributionBase" placeholder="8000" min="2000">
  </div>

  <div class="group">
    <label>累计缴费年限（年）</label>
    <input type="number" id="contributionYears" placeholder="15" min="1" max="50">
  </div>

  <button onclick="calculate()">计算退休金额</button>

  <div class="result" id="result">
    <div class="result-item">
      <span class="label">退休日期</span>
      <span class="value" id="retireDate">-</span>
    </div>
    <div class="result-item">
      <span class="label">距退休</span>
      <span class="value" id="yearsLeft">-</span>
    </div>
    <div class="result-item">
      <span class="label">个人账户余额（估算）</span>
      <span class="value" id="accountBalance">-</span>
    </div>
    <div class="result-item">
      <span class="label">预计每月退休金</span>
      <span class="value highlight" id="monthlyPension">-</span>
    </div>
    <div class="result-item">
      <span class="label">预计一次性取出</span>
      <span class="value" id="oneTime">-</span>
    </div>
  </div>

  <p class="disclaimer">⚠️ 计算结果仅供参考，实际退休金以当地社保局核算为准。</p>
</div>

<script>
function calculate() {
  const gender = document.getElementById('gender').value;
  const birthYear = parseInt(document.getElementById('birthYear').value);
  const currentAge = parseInt(document.getElementById('currentAge').value);
  const retireAge = parseInt(document.getElementById('retireAge').value);
  const monthlySalary = parseInt(document.getElementById('monthlySalary').value) || 10000;
  const contributionBase = parseInt(document.getElementById('contributionBase').value) || monthlySalary * 0.6;
  const contributionYears = parseInt(document.getElementById('contributionYears').value) || 15;

  // 法定退休年龄
  const legalRetireAge = retireAge || (gender === 'male' ? 60 : 55);
  const retireYear = birthYear + legalRetireAge;

  // 距退休年数
  const yearsLeft = legalRetireAge - currentAge;

  // 个人账户估算（按8%缴费，利率3%复利）
  let accountBalance = 0;
  const monthlyContrib = contributionBase * 0.08;
  const monthlyRate = 0.03 / 12;
  for (let i = 0; i < contributionYears * 12; i++) {
    accountBalance = (accountBalance + monthlyContrib) * (1 + monthlyRate);
  }

  // 计发月数（60岁退休计发139月，55岁退休计发170月）
  const monthsToPay = legalRetireAge === 60 ? 139 : legalRetireAge === 55 ? 170 : 175;

  // 基础养老金估算
  const basePension = (contributionBase * 0.2) + (contributionBase * contributionYears * 0.01);

  // 个人账户养老金
  const personalPension = accountBalance / monthsToPay;

  // 每月总退休金
  const monthlyPension = Math.round(basePension + personalPension);

  // 一次性取出（未到退休年龄时）
  const oneTime = Math.round(accountBalance * 1.1);

  // 渲染结果
  document.getElementById('retireDate').textContent = `${retireYear}年`;
  document.getElementById('yearsLeft').textContent = yearsLeft > 0 ? `${yearsLeft} 年` : '已退休';
  document.getElementById('accountBalance').textContent = `¥${Math.round(accountBalance).toLocaleString()}`;
  document.getElementById('monthlyPension').textContent = `¥${monthlyPension.toLocaleString()}/月`;
  document.getElementById('oneTime').textContent = `¥${oneTime.toLocaleString()}`;

  document.getElementById('result').classList.add('show');
}
</script>
</body>
</html>

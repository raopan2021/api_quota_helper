name: Tauri Desktop Build

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/Tauri-Desktop.yml"
      - "tauri/**"
      - "web-vue/**"

  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libsoup2.4-dev \
            libjavascriptcoregtk-4.0-dev \
            librsvg2-dev \
            libappindicator3-dev \
            patchelf \
            libgtk-3-dev \
            libsqlite3-dev \
            libpsl-dev \
            libbrotli-dev

      - name: 构建前端
        run: |
          cd web-vue && npm ci && npm run build

      - name: 构建 Tauri (Linux)
        run: |
          cd tauri && cargo tauri build --bundles deb,rpm

      - name: 上传 Linux 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux-builds-${{ github.run_number }}
          path: |
            tauri/target/release/bundle/deb/*.deb
            tauri/target/release/bundle/rpm/*.rpm
            tauri/target/release/api额度助手

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 构建前端
        run: |
          cd web-vue; npm ci; npm run build

      - name: 修复 tauri.conf.json 路径
        # Windows 上 beforeBuildCommand 用占位符，实际前端已构建
        run: |
          $file = "tauri\tauri.conf.json"
          $json = Get-Content $file -Raw | ConvertFrom-Json
          $json.build.beforeBuildCommand = 'echo "built externally"'
          $json.build.distDir = '..\web-vue\dist'
          $json | ConvertTo-Json -Depth 10 | Set-Content $file -Encoding UTF8

      - name: 构建 Tauri (Windows)
        run: |
          cd tauri; cargo tauri build --bundles msi,nsis

      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-builds-${{ github.run_number }}
          path: |
            tauri/target/release/bundle/msi/*.msi
            tauri/target/release/bundle/nsis/*.exe
            tauri/target/release/api额度助手.exe

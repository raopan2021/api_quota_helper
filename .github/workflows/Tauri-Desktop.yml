name: Tauri Desktop Build

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/Tauri-Desktop.yml"
      - "tauri/**"
      - "web-vue/**"

  workflow_dispatch:

env:
  APP_VERSION: ${{ vars.APP_VERSION || '1.1.1' }}

jobs:
  # ==========================================
  # Linux 构建
  # ==========================================
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 tauri-cli
        run: cargo install tauri-cli --version "^1"

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libsoup2.4-dev \
            libjavascriptcoregtk-4.0-dev \
            librsvg2-dev \
            libappindicator3-dev \
            patchelf \
            libgtk-3-dev \
            libsqlite3-dev \
            libpsl-dev \
            libbrotli-dev

      - name: 统一版本号
        run: |
          APP_VER="${{ env.APP_VERSION }}"
          echo "构建版本: $APP_VER"
          sed -i "s/^version = \".*\"/version = \"$APP_VER\"/" tauri/Cargo.toml
          sed -i "s/^\s*\"version\": \".*\"/    \"version\": \"$APP_VER\"/" tauri/tauri.conf.json

      - name: 构建前端
        run: |
          cd web-vue && npm ci && npm run build

      - name: 构建 Tauri (Linux)
        run: |
          cd tauri && cargo tauri build --bundles deb,rpm

      - name: 上传 Linux 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux-${{ env.APP_VERSION }}
          path: |
            tauri/target/release/bundle/deb/*.deb
            tauri/target/release/bundle/rpm/*.rpm
            tauri/target/release/api-quota-helper

  # ==========================================
  # Windows 构建（单文件 exe）
  # ==========================================
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 tauri-cli
        run: cargo install tauri-cli --version "^1"

      - name: 统一版本号
        shell: bash
        run: |
          APP_VER="${{ env.APP_VERSION }}"
          echo "构建版本: $APP_VER"
          sed -i "s/^version = \".*\"/version = \"$APP_VER\"/" tauri/Cargo.toml
          sed -i "s/^\s*\"version\": \".*\"/    \"version\": \"$APP_VER\"/" tauri/tauri.conf.json

      - name: 构建前端
        shell: bash
        run: |
          cd web-vue; npm ci; npm run build

      - name: 修复 tauri.conf.json 路径
        shell: bash
        run: |
          sed -i 's|"beforeBuildCommand": "echo skip"|"beforeBuildCommand": "echo skip"|' tauri/tauri.conf.json
          sed -i 's|"distDir": ".*"|"distDir": "../web-vue/dist"|' tauri/tauri.conf.json

      - name: 构建 Tauri (Windows 单文件)
        shell: bash
        run: |
          cd tauri; cargo tauri build --bundles none

      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-${{ env.APP_VERSION }}
          path: |
            tauri/target/release/api-quota-helper.exe
